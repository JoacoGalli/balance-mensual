    /* Service worker: habilita instalar la app en el celular y usarla sin conexión. */
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", function () {

      });
    }
  </script>
